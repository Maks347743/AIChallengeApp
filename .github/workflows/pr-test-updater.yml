name: AI Unit Test Updater

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  pull-requests: write
  contents: write

jobs:
  update-tests:
    name: AI Test Updater
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Replace broken gradlew
        run: |
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradlew" -o gradlew
          chmod +x gradlew

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Run AI test updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          PR_HEAD_BRANCH: ${{ github.head_ref }}
        run: python .github/scripts/pr_test_updater.py
